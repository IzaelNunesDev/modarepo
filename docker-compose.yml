# ============================================================
# Moda Store — Docker Compose (Production)
# Frontend + Backend + Redis + Nginx
# ============================================================

services:
  # ─── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: moda-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - moda-network

  # ─── Database (PostgreSQL) ────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: moda-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-modadb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - moda-network
    restart: unless-stopped

  # ─── Frontend (Next.js) ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${PUBLIC_IP}/api
    container_name: moda-frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    restart: unless-stopped
    networks:
      - moda-network

  # ─── Backend (Express + Stripe + BullMQ) ─────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: moda-backend
    expose:
      - "3001"
    env_file:
      - .env.production
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - moda-network

  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: moda-redis
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - moda-network

# ─── Volumes ───────────────────────────────────────────────
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local

# ─── Network ──────────────────────────────────────────────
networks:
  moda-network:
    driver: bridge
